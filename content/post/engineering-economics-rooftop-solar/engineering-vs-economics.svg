<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-label="Engineering and economics ask different questions"><title>Engineering and economics ask different questions</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="75" y="80" class="title">The same project, two different questions</text><rect x="80" y="155" width="560" height="370" rx="28" fill="#263a78" opacity="0.08" stroke="#263a78" stroke-width="3"/><rect x="760" y="155" width="560" height="370" rx="28" fill="#2f9e44" opacity="0.08" stroke="#2f9e44" stroke-width="3"/><text x="360" y="225" class="title" text-anchor="middle">Engineering</text><text x="1040" y="225" class="title" text-anchor="middle">Economics</text><text x="360" y="305" class="big" text-anchor="middle">Would solar pay?</text><text x="1040" y="305" class="big" text-anchor="middle">Was it adopted?</text><text x="360" y="390" class="label" text-anchor="middle"><tspan x="360" dy="0">Estimate generation, bills, costs,</tspan><tspan x="360" dy="36">financing, incentives, and NPV.</tspan></text><text x="1040" y="390" class="label" text-anchor="middle"><tspan x="1040" dy="0">Compare estimated payoffs with</tspan><tspan x="1040" dy="36">observed choices and policy</tspan><tspan x="1040" dy="36">changes.</tspan></text><text x="700" y="600" class="subtitle" text-anchor="middle">The paper’s contribution comes from linking the two.</text></svg>