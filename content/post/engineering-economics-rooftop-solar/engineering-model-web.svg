<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-label="Data and engineering workflow"><title>Data and engineering workflow</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="70" y="75" class="title">From real buildings to project-level payoff estimates</text><text x="70" y="118" class="subtitle">The analysis combines multiple datasets before running NREL’s System Advisor Model</text><rect x="80" y="190" width="330" height="145" rx="22" class="card"/><text x="105" y="238" class="label">Building permits</text><text x="105" y="278" class="small" text-anchor="start"><tspan x="105" dy="0">Project address, type,</tspan><tspan x="105" dy="30">timing</tspan></text><rect x="500" y="190" width="330" height="145" rx="22" class="card"/><text x="525" y="238" class="label">Local sunlight</text><text x="525" y="278" class="small" text-anchor="start"><tspan x="525" dy="0">4 km weather and irradiance</tspan></text><rect x="920" y="190" width="330" height="145" rx="22" class="card"/><text x="945" y="238" class="label">Rooftop shading</text><text x="945" y="278" class="small" text-anchor="start"><tspan x="945" dy="0">Google Project Sunroof</tspan></text><rect x="80" y="410" width="330" height="145" rx="22" class="card"/><text x="105" y="458" class="label">Electricity use</text><text x="105" y="498" class="small" text-anchor="start"><tspan x="105" dy="0">PG&amp;E hourly load profiles</tspan></text><rect x="500" y="410" width="330" height="145" rx="22" class="card"/><text x="525" y="458" class="label">Tariffs &amp; policy</text><text x="525" y="498" class="small" text-anchor="start"><tspan x="525" dy="0">Historical rates, net</tspan><tspan x="525" dy="30">metering, incentives</tspan></text><rect x="920" y="410" width="330" height="145" rx="22" class="card"/><text x="945" y="458" class="label">Installation costs</text><text x="945" y="498" class="small" text-anchor="start"><tspan x="945" dy="0">City-by-year</tspan><tspan x="945" dy="30">interconnection records</tspan></text><path d="M 245 335 C 245 380, 700 610, 700 665" class="arrow"/><path d="M 665 335 C 665 380, 700 610, 700 665" class="arrow"/><path d="M 1085 335 C 1085 380, 700 610, 700 665" class="arrow"/><path d="M 245 555 C 245 600, 700 610, 700 665" class="arrow"/><path d="M 665 555 C 665 600, 700 610, 700 665" class="arrow"/><path d="M 1085 555 C 1085 600, 700 610, 700 665" class="arrow"/><rect x="455" y="675" width="490" height="145" rx="26" fill="#263a78" opacity="0.10" stroke="#263a78" stroke-width="3"/><text x="700" y="730" class="title" text-anchor="middle">NREL SAM + system-size optimization</text><text x="700" y="780" class="subtitle" text-anchor="middle">Estimate the private NPV that maximizes payoff for each project</text><path d="M 700 820 L 700 875" class="arrow"/><rect x="455" y="880" width="490" height="75" rx="20" fill="#2f9e44" opacity="0.12" stroke="#2f9e44" stroke-width="3"/><text x="700" y="928" class="label" text-anchor="middle">Project-level expected payoff</text></svg>