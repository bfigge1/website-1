<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="670" viewBox="0 0 1400 670" role="img" aria-label="Synthetic control estimates the missing counterfactual"><title>Synthetic control estimates the missing counterfactual</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="75" y="80" class="title">Policy evaluation requires a missing history</text><text x="75" y="123" class="subtitle">Synthetic control estimates what likely would have happened without the mandate</text><line x1="130" y1="560" x2="1280" y2="560" stroke="#1f2933" stroke-width="3"/><line x1="690" y1="180" x2="690" y2="560" stroke="#c23b3b" stroke-width="4"/><text x="710" y="210" class="label">Mandate begins</text><polyline points="130,500 260,470 390,440 520,400 650,380 760,310 900,270 1040,220 1200,170" fill="none" stroke="#263a78" stroke-width="7"/><polyline points="130,500 260,468 390,445 520,402 650,382 760,370 900,350 1040,330 1200,315" fill="none" stroke="#2f9e44" stroke-width="7" stroke-dasharray="16 12"/><text x="1110" y="155" class="label">Observed</text><text x="1070" y="350" class="label">Synthetic counterfactual</text><text x="130" y="620" class="small">Pre-policy: the series should track closely</text><text x="790" y="620" class="small">Post-policy gap: estimated effect</text></svg>