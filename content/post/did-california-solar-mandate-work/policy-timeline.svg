<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="California rooftop solar policy timeline"><title>California rooftop solar policy timeline</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="75" y="80" class="title">A sequence of rooftop-solar requirements</text><line x1="180" y1="310" x2="1160" y2="310" stroke="#1f2933" stroke-width="5"/><circle cx="220" cy="310" r="17" fill="#263a78"/><text x="220" y="245" class="big" text-anchor="middle">2013</text><text x="220" y="365" class="label" text-anchor="middle">California</text><text x="220" y="399" class="label" text-anchor="middle">solar-ready rules</text><circle cx="520" cy="310" r="17" fill="#263a78"/><text x="520" y="245" class="big" text-anchor="middle">2017</text><text x="520" y="365" class="label" text-anchor="middle">San Francisco</text><text x="520" y="399" class="label" text-anchor="middle">Better Roofs</text><circle cx="820" cy="310" r="17" fill="#263a78"/><text x="820" y="245" class="big" text-anchor="middle">2020</text><text x="820" y="365" class="label" text-anchor="middle">Statewide low-rise</text><text x="820" y="399" class="label" text-anchor="middle">residential mandate</text><circle cx="1120" cy="310" r="17" fill="#263a78"/><text x="1120" y="245" class="big" text-anchor="middle">2023</text><text x="1120" y="365" class="label" text-anchor="middle">Expanded code and</text><text x="1120" y="399" class="label" text-anchor="middle">storage requirements</text></svg>