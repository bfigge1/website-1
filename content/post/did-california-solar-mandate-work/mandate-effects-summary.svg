<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-label="Estimated mandate effects in San Francisco and California"><title>Estimated mandate effects in San Francisco and California</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="75" y="80" class="title">Both mandates substantially increased solar adoption</text><rect x="90" y="165" width="570" height="420" rx="30" fill="#263a78" opacity="0.08" stroke="#263a78" stroke-width="3"/><rect x="740" y="165" width="570" height="420" rx="30" fill="#2f9e44" opacity="0.08" stroke="#2f9e44" stroke-width="3"/><text x="375" y="230" class="title" text-anchor="middle">San Francisco</text><text x="375" y="340" class="big" text-anchor="middle">+33 pp</text><text x="375" y="395" class="label" text-anchor="middle">share of new residential</text><text x="375" y="430" class="label" text-anchor="middle">buildings with solar PV</text><text x="375" y="505" class="small" text-anchor="middle">SDID estimate: +31 percentage points</text><text x="1025" y="230" class="title" text-anchor="middle">California</text><text x="1025" y="340" class="big" text-anchor="middle">+38–60%</text><text x="1025" y="395" class="label" text-anchor="middle">residential solar capacity</text><text x="1025" y="430" class="label" text-anchor="middle">per new building permit</text><text x="1025" y="505" class="small" text-anchor="middle">≈ +5.4 to +8.5 kW, depending on estimator</text><text x="700" y="660" class="subtitle" text-anchor="middle">The statewide measure is a validated proxy, not direct project-level adoption.</text></svg>