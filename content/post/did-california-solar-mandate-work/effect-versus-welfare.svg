<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-label="Causal effect and policy desirability are distinct questions"><title>Causal effect and policy desirability are distinct questions</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="75" y="80" class="title">A larger effect does not automatically imply a better policy</text><rect x="90" y="170" width="535" height="335" rx="28" class="card"/><rect x="775" y="170" width="535" height="335" rx="28" class="card"/><text x="358" y="235" class="title" text-anchor="middle">Causal effect</text><text x="358" y="315" class="big" text-anchor="middle">Did adoption rise?</text><text x="358" y="390" class="label" text-anchor="middle"><tspan x="358" dy="0">Synthetic control and SDID answer this</tspan><tspan x="358" dy="38">question.</tspan></text><text x="1042" y="235" class="title" text-anchor="middle">Policy desirability</text><text x="1042" y="315" class="big" text-anchor="middle">Was it worth it?</text><text x="1042" y="390" class="label" text-anchor="middle"><tspan x="1042" dy="0">Requires transfers, external benefits,</tspan><tspan x="1042" dy="38">costs, and comparison with alternatives.</tspan></text><path d="M 625 338 L 775 338" class="arrow"/><text x="700" y="565" class="subtitle" text-anchor="middle">The paper finds strong adoption effects but remains cautious on efficiency relative to utility-scale solar.</text></svg>