<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-label="NPV explains less than eight percent of adoption variation"><title>NPV explains less than eight percent of adoption variation</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="80" y="85" class="title">Profitability is part of the story—not most of it</text><text x="80" y="128" class="subtitle">Linear probability models in the paper</text><circle cx="360" cy="350" r="170" fill="none" stroke="#d9dee5" stroke-width="40"/><path d="M 360 180 A 170 170 0 0 1 442 201" fill="none" stroke="#2f9e44" stroke-width="40" stroke-linecap="round"/><text x="360" y="345" class="big" text-anchor="middle">&lt; 8%</text><text x="360" y="390" class="label" text-anchor="middle">of adoption variation</text><text x="360" y="425" class="label" text-anchor="middle">explained by estimated NPV</text><rect x="660" y="210" width="600" height="275" rx="26" class="card"/><text x="705" y="270" class="label">Careful interpretation</text><text x="705" y="320" class="label" text-anchor="start"><tspan x="705" dy="0">The result documents a weak payoff–adoption</tspan><tspan x="705" dy="38">relationship. It does not prove that builders were</tspan><tspan x="705" dy="38">irrational or that the model captures every project-</tspan><tspan x="705" dy="38">specific cost.</tspan></text></svg>