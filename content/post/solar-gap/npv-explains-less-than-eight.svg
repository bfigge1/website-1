<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="NPV explains less than eight percent of adoption variation">
<title>NPV explains less than eight percent of adoption variation</title><rect width="100%" height="100%" fill="white"/>
<style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}</style><text x="80" y="85" class="title">Profitability is part of the story—not most of it</text>
<text x="80" y="128" class="subtitle">Linear probability models reported in the paper</text>
<rect x="100" y="205" width="430" height="290" rx="28" fill="#263a78" opacity="0.08" stroke="#263a78" stroke-width="3"/>
<text x="315" y="330" class="big" text-anchor="middle">&lt; 8%</text>
<text x="315" y="385" class="label" text-anchor="middle">of observed adoption variation</text>
<text x="315" y="425" class="label" text-anchor="middle">explained by estimated NPV</text>
<rect x="650" y="205" width="650" height="290" rx="28" class="card"/>
<text x="695" y="270" class="label">Careful interpretation</text>
<text x="695" y="325" class="small">The result documents a weak payoff–adoption relationship.</text>
<text x="695" y="363" class="small">It does not prove that builders were irrational, or that the</text>
<text x="695" y="401" class="small">engineering model captures every project-specific constraint.</text>
</svg>