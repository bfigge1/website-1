<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-label="Possible explanations for the solar gap"><title>Possible explanations for the solar gap</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="75" y="80" class="title">Several mechanisms could weaken the payoff–adoption link</text><rect x="80" y="155" width="560" height="145" rx="22" class="card"/><text x="108" y="205" class="label">Split incentives</text><text x="108" y="246" class="small" text-anchor="start"><tspan x="108" dy="0">Builders bear costs; occupants receive bill</tspan><tspan x="108" dy="30">savings.</tspan></text><rect x="720" y="155" width="560" height="145" rx="22" class="card"/><text x="748" y="205" class="label">Hassle costs</text><text x="748" y="246" class="small" text-anchor="start"><tspan x="748" dy="0">Permitting, contractors, design, and</tspan><tspan x="748" dy="30">interconnection.</tspan></text><rect x="80" y="355" width="560" height="145" rx="22" class="card"/><text x="108" y="405" class="label">Uncertainty</text><text x="108" y="446" class="small" text-anchor="start"><tspan x="108" dy="0">Future rates, net metering, incentives, and</tspan><tspan x="108" dy="30">timelines.</tspan></text><rect x="720" y="355" width="560" height="145" rx="22" class="card"/><text x="748" y="405" class="label">Low salience</text><text x="748" y="446" class="small" text-anchor="start"><tspan x="748" dy="0">Payoffs are often small relative to total</tspan><tspan x="748" dy="30">construction costs.</tspan></text><rect x="80" y="555" width="560" height="145" rx="22" class="card"/><text x="108" y="605" class="label">Model limits</text><text x="108" y="646" class="small" text-anchor="start"><tspan x="108" dy="0">Unobserved roof or project constraints may</tspan><tspan x="108" dy="30">matter.</tspan></text><rect x="720" y="555" width="560" height="145" rx="22" class="card"/><text x="748" y="605" class="label">Financing</text><text x="748" y="646" class="small" text-anchor="start"><tspan x="748" dy="0">Upfront cost and liquidity may outweigh long-</tspan><tspan x="748" dy="30">run returns.</tspan></text></svg>