<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="Solar payoffs are small relative to construction costs">
<title>Solar payoffs are small relative to construction costs</title><rect width="100%" height="100%" fill="white"/>
<style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}</style><text x="80" y="85" class="title">A positive payoff can still be easy to overlook</text>
<text x="80" y="128" class="subtitle">Median values for projects with observed construction costs</text>
<text x="130" y="220" class="label">Solar payoff</text><text x="1180" y="220" class="label" text-anchor="end">Construction cost</text>
<rect x="130" y="250" width="1050" height="95" rx="14" fill="#d9dee5"/>
<rect x="130" y="250" width="17" height="95" rx="14" fill="#2f9e44"/>
<text x="170" y="310" class="label">≈ $7,900</text><text x="1180" y="310" class="label" text-anchor="end">≈ $500,000</text>
<text x="130" y="445" class="big">≈ 1–2%</text>
<text x="405" y="432" class="label">of total project cost for most projects</text>
<text x="405" y="482" class="small">The paper treats low salience, administrative effort, and unobserved costs</text>
<text x="405" y="516" class="small">as plausible explanations—not as proof that builders behaved irrationally.</text>
</svg>