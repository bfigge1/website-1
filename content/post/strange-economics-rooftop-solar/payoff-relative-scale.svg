<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Solar payoffs are small relative to construction costs"><title>Solar payoffs are small relative to construction costs</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="80" y="85" class="title">A positive payoff can still be easy to overlook</text><text x="80" y="128" class="subtitle">Median values for projects with observed construction costs</text><rect x="130" y="250" width="1050" height="95" rx="14" fill="#d9dee5"/><rect x="130" y="250" width="17" height="95" rx="14" fill="#2f9e44"/><text x="130" y="220" class="label">Solar payoff</text><text x="170" y="310" class="label">≈ $7,900</text><text x="1180" y="220" class="label" text-anchor="end">Construction cost</text><text x="1180" y="310" class="label" text-anchor="end">≈ $500,000</text><text x="130" y="410" class="big">≈ 1–2%</text><text x="390" y="400" class="label">of total project cost for most projects</text><text x="390" y="445" class="small" text-anchor="start"><tspan x="390" dy="0">The paper therefore treats low salience, administrative effort,</tspan><tspan x="390" dy="30">and unobserved costs as plausible explanations—not proof of</tspan><tspan x="390" dy="30">irrationality.</tspan></text></svg>