<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-label="Estimated rooftop-solar payoffs vary substantially"><title>Estimated rooftop-solar payoffs vary substantially</title><rect width="100%" height="100%" fill="white"/><style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}.arrow{stroke:#667085;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs><text x="80" y="85" class="title">Estimated payoffs are generally positive—but far from uniform</text><text x="80" y="128" class="subtitle">Illustrative summary of the paper’s project-level SAM estimates</text><line x1="115" y1="610" x2="1275" y2="610" stroke="#1f2933" stroke-width="3"/><line x1="115" y1="610" x2="115" y2="622" stroke="#1f2933" stroke-width="2"/><text x="115" y="658" class="small" text-anchor="middle">$-5k</text><line x1="285" y1="610" x2="285" y2="622" stroke="#1f2933" stroke-width="2"/><text x="285" y="658" class="small" text-anchor="middle">$0k</text><line x1="495" y1="610" x2="495" y2="622" stroke="#1f2933" stroke-width="2"/><text x="495" y="658" class="small" text-anchor="middle">$5k</text><line x1="705" y1="610" x2="705" y2="622" stroke="#1f2933" stroke-width="2"/><text x="705" y="658" class="small" text-anchor="middle">$10k</text><line x1="915" y1="610" x2="915" y2="622" stroke="#1f2933" stroke-width="2"/><text x="915" y="658" class="small" text-anchor="middle">$15k</text><line x1="1125" y1="610" x2="1125" y2="622" stroke="#1f2933" stroke-width="2"/><text x="1125" y="658" class="small" text-anchor="middle">$20k</text><text x="695.0" y="705" class="label" text-anchor="middle">Estimated net present value</text><path d="M 285,610 L 345,565 L 430,405 L 525,335 L 615,490 L 725,570 L 835,540 L 945,390 L 1035,475 L 1125,610 L 1125,610 L 285,610 Z" fill="#263a78" opacity="0.18" stroke="#263a78" stroke-width="4"/><line x1="615" y1="310" x2="615" y2="610" stroke="#263a78" stroke-width="3" stroke-dasharray="8 8"/><text x="629" y="340" class="label">Median ≈ $7,900</text><rect x="855" y="180" width="410" height="235" rx="24" class="card"/><text x="890" y="235" class="label">Alternative assumptions matter</text><text x="890" y="280" class="small" text-anchor="start"><tspan x="890" dy="0">Higher costs, less favorable</tspan><tspan x="890" dy="30">compensation, and project-</tspan><tspan x="890" dy="30">matched electricity use reduce</tspan><tspan x="890" dy="30">some estimated payoffs.</tspan></text><text x="890" y="375" class="small">A minority of projects become negative or near zero.</text></svg>