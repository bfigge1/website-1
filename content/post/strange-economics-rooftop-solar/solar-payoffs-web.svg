<title>Estimated rooftop-solar payoffs vary substantially</title><rect width="100%" height="100%" fill="white"/>
<style>text{font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;fill:#1f2933}.title{font-size:42px;font-weight:700}.subtitle{font-size:25px;fill:#667085}.label{font-size:24px;font-weight:600}.small{font-size:20px;fill:#667085}.big{font-size:62px;font-weight:750}.card{fill:#f4f6f8;stroke:#d9dee5;stroke-width:2}</style><text x="80" y="82" class="title">Estimated payoffs are generally positive—but far from uniform</text>
<text x="80" y="125" class="subtitle">Illustrative summary of the paper’s project-level SAM estimates</text>
<rect x="885" y="175" width="425" height="220" rx="24" class="card"/>
<text x="920" y="228" class="label">Alternative assumptions matter</text>
<text x="920" y="274" class="small">Higher costs, less favorable compensation,</text>
<text x="920" y="306" class="small">and project-matched electricity use reduce</text>
<text x="920" y="338" class="small">some estimated payoffs.</text>
<text x="920" y="375" class="small">A minority become negative or near zero.</text>
